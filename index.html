<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywny Nauczyciel i Sprawdziany</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --error: #EF4444;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --border: #D1D5DB;
        }
        
        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 700px;
            box-sizing: border-box;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary);
        }

        h1 { margin-top: 0; font-size: 1.8rem; margin-bottom: 1.5rem; }
        h2 { font-size: 1.3rem; margin-bottom: 1rem; color: #374151; }

        .form-group { margin-bottom: 1.5rem; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background-color: #F9FAFB;
            box-sizing: border-box;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        select:disabled {
            background-color: #E5E7EB;
            cursor: not-allowed;
            color: #9CA3AF;
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 1rem;
        }

        button:hover { background-color: var(--primary-hover); }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #9CA3AF; cursor: not-allowed; }

        #test-area, #result-box {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #E5E7EB;
        }

        .question {
            background: #F9FAFB;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .question p {
            margin-top: 0;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .options label {
            display: flex;
            align-items: center;
            font-weight: 400;
            margin-bottom: 0.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .options label:hover { background: #EEF2FF; }

        .options input[type="radio"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }

        .feedback.correct { background-color: #D1FAE5; color: #065F46; border: 1px solid #10B981; display: block; }
        .feedback.incorrect { background-color: #FEE2E2; color: #991B1B; border: 1px solid #EF4444; display: block; }
        .feedback.neutral { background-color: #DBEAFE; color: #1E40AF; border: 1px solid #3B82F6; display: block; }
        
        .score-display {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            color: var(--primary);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Platforma Sprawdzianów</h1>
    
    <div class="form-group">
        <label for="subject">Wybierz przedmiot:</label>
        <select id="subject">
            <option value="" disabled selected>-- Wybierz --</option>
            <option value="Język Polski">Język Polski</option>
        </select>
    </div>

    <div class="form-group">
        <label for="topic">Wybierz temat:</label>
        <select id="topic" disabled>
            <option value="" disabled selected>-- Najpierw wybierz przedmiot --</option>
        </select>
    </div>

    <button id="generate-btn">Losuj Nowy Sprawdzian</button>

    <!-- Obszar dynamicznego generowania testu -->
    <div id="test-area">
        <h2>Sprawdzian: Zagadnienia maturalne</h2>
        <div id="questions-container"></div>
        <button id="check-btn">Oddaj sprawdzian do oceny</button>
    </div>

    <!-- Wynik -->
    <div id="result-box">
        <div class="score-display" id="score-text"></div>
        <div id="teacher-comment"></div>
    </div>
</div>

<script>
    // PULA PYTAŃ ZAMKNIĘTYCH (Wyciągnięte z Twoich notatek)
    const closedPool = [
        {
            q: "Z jakimi pojęciami, według notatek, wiąże się omówienie 'Antygony'?",
            options: {A: "Ars bene moriendi", B: "Motyw vanitas i katastrofizm", C: "Hybris i konflikt tragiczny", D: "Komizm"},
            correct: "C",
            feedback: "Zgadza się! Hybris (pycha) i konflikt tragiczny to główne zagadnienia z Antygony."
        },
        {
            q: "Jakie elementy przypisałeś w notatkach do 'Pieśni o Rolandzie'?",
            options: {A: "Deskralizacja Maryi", B: "Ars bene moriendi oraz poemat rycerski", C: "Dance macabre", D: "Archaizmy"},
            correct: "B",
            feedback: "Świetnie! 'Ars bene moriendi' (sztuka dobrego umierania) i chansons de geste pasują do Rolanda."
        },
        {
            q: "Co charakteryzuje 'Makbeta' na tle dramatów z antyku?",
            options: {A: "Pełne podporządkowanie fatum", B: "Brak fatum w losach bohatera", C: "Motyw vanitas", D: "Cechy sielanki"},
            correct: "B",
            feedback: "Dobrze! W notatkach zapisałeś 'nie ma fatum' w kontekście Makbeta."
        },
        {
            q: "Jaki motyw jest przypisany do 'Rozmowy Mistrza Polikarpa ze Śmiercią'?",
            options: {A: "Dance macabre", B: "Poemat rycerski", C: "Komedia charakterów", D: "Poezja tyrtejska"},
            correct: "A",
            feedback: "Poprawnie. 'Dance macabre' (taniec śmierci) to motyw przewodni tego utworu."
        },
        {
            q: "Które zjawisko przypisałeś w notatkach do 'Lamentu świętokrzyskiego'?",
            options: {A: "Budowa i archaizmy", B: "Konflikt tragiczny", C: "Deskralizacja Maryi", D: "Motyw cierpienia niezawinionego"},
            correct: "C",
            feedback: "Brawo. Deskralizacja Maryi (czyli ukazanie jej ludzkiego, cierpiącego oblicza) to klucz do Lamentu."
        },
        {
            q: "Jakie cechy przypisałeś komedii 'Skąpiec'?",
            options: {A: "Katastrofizm", B: "Komizm + komedia charakterów", C: "Motyw vanitas", D: "Hybris"},
            correct: "B",
            feedback: "Dokładnie tak, 'Skąpiec' to sztandarowy przykład komedii charakterów Molière'a."
        }
    ];

    // PULA PYTAŃ OTWARTYCH (Wyciągnięte z Twoich notatek)
    const openPool = [
        {
            q: "Wypisz z notatek dwa główne zagadnienia związane z 'Iliadą' (dział Antyk).",
            key: "Klucz z notatek: 1) dlaczego doszło do wojny, 2) pojedynek Achillesa z Hektorem."
        },
        {
            q: "Wymień przynajmniej dwa tytuły satyr i dwie bajki Ignacego Krasickiego z Twoich notatek.",
            key: "Klucz z notatek: Satyry: 'Do króla', 'Świat zepsuty', 'Żona modna'. Bajki: 'Ptaszki w klatce', 'Przyjaciele'."
        },
        {
            q: "Jakie mity antyczne musisz znać na maturę (wymień przynajmniej trzy zapisane w notatkach)?",
            key: "Klucz z notatek (do wyboru): Niobe, Prometeusz, Syzyf, Orfeusz i Eurydyka, Legendy Tebańskie, Historia Wojny Trojańskiej."
        },
        {
            q: "Jakie treny Jana Kochanowskiego zostały wymienione w notatkach do epoki Renesansu?",
            key: "Klucz z notatek: Należało wymienić Treny: IX, X, XI."
        },
        {
            q: "Jakie trzy zagadnienia przypisałeś w notatkach do 'Bogurodzicy'?",
            key: "Klucz z notatek: 1) treść, 2) budowa, 3) archaizmy."
        },
        {
            q: "Wymień trzech polskich poetów epoki Baroku wymienionych w notatkach.",
            key: "Klucz z notatek: Daniel Naborowski, Jan Andrzej Morsztyn, Mikołaj Sęp-Szarzyński."
        }
    ];

    // Zmienne globalne do przechowywania wylosowanych pytań dla obecnej sesji
    let currentClosed = [];
    let currentOpen = [];

    const topicsData = {
        "Język Polski": ["Zagadnienia maturalne (Losowe Pytania)"]
    };

    const subjectSelect = document.getElementById("subject");
    const topicSelect = document.getElementById("topic");
    const generateBtn = document.getElementById("generate-btn");
    const testArea = document.getElementById("test-area");
    const questionsContainer = document.getElementById("questions-container");
    const resultBox = document.getElementById("result-box");
    const checkBtn = document.getElementById("check-btn");

    subjectSelect.addEventListener("change", function() {
        const selectedSubject = this.value;
        topicSelect.innerHTML = '<option value="" disabled selected>-- Wybierz temat --</option>';
        topicSelect.disabled = false;
        topicsData[selectedSubject].forEach(topic => {
            topicSelect.innerHTML += `<option value="${topic}">${topic}</option>`;
        });
        testArea.style.display = "none";
        resultBox.style.display = "none";
    });

    // Funkcja mieszająca tablicę (Fisher-Yates)
    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Losowanie testu i renderowanie DOM
    generateBtn.addEventListener("click", function() {
        if (!topicSelect.value) {
            alert("Wybierz temat!");
            return;
        }

        // Reset UI
        checkBtn.textContent = "Oddaj sprawdzian do oceny";
        checkBtn.disabled = false;
        checkBtn.style.backgroundColor = "var(--primary)";
        resultBox.style.display = "none";
        questionsContainer.innerHTML = "";
        testArea.style.display = "block";

        // Losowanie pytań (3 zamknięte, 2 otwarte)
        currentClosed = shuffleArray(closedPool).slice(0, 3);
        currentOpen = shuffleArray(openPool).slice(0, 2);

        let questionNumber = 1;

        // Renderowanie pytań zamkniętych
        currentClosed.forEach((qObj, index) => {
            const optionsHtml = Object.entries(qObj.options).map(([key, value]) => `
                <label><input type="radio" name="c_${index}" value="${key}"> ${key}) ${value}</label>
            `).join('');

            questionsContainer.innerHTML += `
                <div class="question">
                    <p>${questionNumber}. ${qObj.q}</p>
                    <div class="options">${optionsHtml}</div>
                    <div id="c-feedback-${index}" class="feedback"></div>
                </div>
            `;
            questionNumber++;
        });

        // Renderowanie pytań otwartych
        currentOpen.forEach((qObj, index) => {
            questionsContainer.innerHTML += `
                <div class="question">
                    <p>${questionNumber}. ${qObj.q}</p>
                    <textarea placeholder="Wpisz swoją odpowiedź tutaj..."></textarea>
                    <div id="o-feedback-${index}" class="feedback"></div>
                </div>
            `;
            questionNumber++;
        });
    });

    // Ocenianie sprawdzianu
    checkBtn.addEventListener("click", function() {
        let score = 0;

        // Sprawdzanie pytań zamkniętych
        currentClosed.forEach((qObj, index) => {
            const selected = document.querySelector(`input[name="c_${index}"]:checked`);
            const feedbackBox = document.getElementById(`c-feedback-${index}`);
            
            if (selected) {
                if (selected.value === qObj.correct) {
                    score++;
                    feedbackBox.textContent = qObj.feedback;
                    feedbackBox.className = "feedback correct";
                } else {
                    feedbackBox.textContent = `Błąd. Poprawna odpowiedź to ${qObj.correct}.`;
                    feedbackBox.className = "feedback incorrect";
                }
            } else {
                feedbackBox.textContent = `Brak odpowiedzi. Poprawna to ${qObj.correct}.`;
                feedbackBox.className = "feedback incorrect";
            }
        });

        // Pokazywanie klucza do pytań otwartych
        currentOpen.forEach((qObj, index) => {
            const feedbackBox = document.getElementById(`o-feedback-${index}`);
            feedbackBox.innerHTML = `<strong>Sprawdź się (Klucz Nauczyciela):</strong><br>${qObj.key}`;
            feedbackBox.className = "feedback neutral";
        });

        // Obliczenie i wyświetlenie wyniku
        const scoreDisplay = document.getElementById("score-text");
        const comment = document.getElementById("teacher-comment");
        
        let finalGrade = 1;
        if (score === 3) finalGrade = "4 lub 5";
        else if (score === 2) finalGrade = "3";
        else if (score === 1) finalGrade = "2";

        resultBox.style.display = "block";
        scoreDisplay.textContent = `Wynik: ${score}/3 punktów`;
        comment.innerHTML = `
            <p><strong>Szacowana ocena za pytania zamknięte: ${finalGrade}</strong></p>
            <p>Przeczytaj wygenerowane klucze pod pytaniami otwartymi i zrób samoocenę swojego tekstu. Kliknij <em>"Losuj Nowy Sprawdzian"</em> u góry, aby wygenerować zupełnie nowy, inny zestaw pytań z tego samego działu!</p>
        `;
        
        checkBtn.textContent = "Sprawdzian został oceniony";
        checkBtn.disabled = true;
    });
</script>

</body>
</html>
