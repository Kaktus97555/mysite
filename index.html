<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywny Nauczyciel i Sprawdziany</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --error: #EF4444;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --border: #D1D5DB;
        }
        
        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 700px;
            box-sizing: border-box;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary);
        }

        h1 { margin-top: 0; font-size: 1.8rem; margin-bottom: 1.5rem; }
        h2 { font-size: 1.3rem; margin-bottom: 1rem; color: #374151; }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background-color: #F9FAFB;
            box-sizing: border-box;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        select:disabled {
            background-color: #E5E7EB;
            cursor: not-allowed;
            color: #9CA3AF;
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 1rem;
        }

        button:hover { background-color: var(--primary-hover); }
        button:active { transform: scale(0.98); }

        #test-container, #result-box {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #E5E7EB;
        }

        .question {
            background: #F9FAFB;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .question p {
            margin-top: 0;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .options label {
            display: flex;
            align-items: center;
            font-weight: 400;
            margin-bottom: 0.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .options label:hover {
            background: #EEF2FF;
        }

        .options input[type="radio"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }

        .feedback.correct {
            background-color: #D1FAE5;
            color: #065F46;
            border: 1px solid #10B981;
            display: block;
        }

        .feedback.incorrect {
            background-color: #FEE2E2;
            color: #991B1B;
            border: 1px solid #EF4444;
            display: block;
        }

        .feedback.neutral {
            background-color: #DBEAFE;
            color: #1E40AF;
            border: 1px solid #3B82F6;
            display: block;
        }
        
        .score-display {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            color: var(--primary);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Platforma Sprawdzianów</h1>
    
    <div class="form-group">
        <label for="subject">Wybierz przedmiot:</label>
        <select id="subject">
            <option value="" disabled selected>-- Wybierz --</option>
            <option value="Matematyka">Matematyka</option>
            <option value="Język Polski">Język Polski</option>
        </select>
    </div>

    <div class="form-group">
        <label for="topic">Wybierz temat:</label>
        <select id="topic" disabled>
            <option value="" disabled selected>-- Najpierw wybierz przedmiot --</option>
        </select>
    </div>

    <button id="generate-btn">Wczytaj Sprawdzian</button>

    <!-- Kontener na test -->
    <div id="test-container">
        <h2>Sprawdzian: Zagadnienia maturalne</h2>
        
        <!-- Pytanie 1 -->
        <div class="question" id="q1-container">
            <p>1. Z jakimi pojęciami, według notatek, wiąże się omówienie "Antygony"?</p>
            <div class="options">
                <label><input type="radio" name="q1" value="A"> A) Ars bene moriendi i dance macabre</label>
                <label><input type="radio" name="q1" value="B"> B) Motyw vanitas i katastrofizm</label>
                <label><input type="radio" name="q1" value="C"> C) Hybris i konflikt tragiczny</label>
                <label><input type="radio" name="q1" value="D"> D) Komizm i komedia charakterów</label>
            </div>
            <div id="q1-feedback" class="feedback"></div>
        </div>

        <!-- Pytanie 2 -->
        <div class="question" id="q2-container">
            <p>2. Jakie elementy i gatunki zostały przypisane w notatkach do "Pieśni o Rolandzie"?</p>
            <div class="options">
                <label><input type="radio" name="q2" value="A"> A) Deskralizacja Maryi i lament</label>
                <label><input type="radio" name="q2" value="B"> B) Ars
