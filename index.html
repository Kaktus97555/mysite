<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywny Nauczyciel i Sprawdziany</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --error: #EF4444;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --border: #D1D5DB;
        }
        
        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 750px;
            box-sizing: border-box;
        }

        h1, h2 { text-align: center; color: var(--primary); }
        h1 { margin-top: 0; font-size: 1.8rem; margin-bottom: 1.5rem; }
        h2 { font-size: 1.3rem; margin-bottom: 1rem; color: #374151; }

        .form-group { margin-bottom: 1.5rem; }

        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.95rem; }

        select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background-color: #F9FAFB;
            box-sizing: border-box;
        }
        
        textarea { resize: vertical; min-height: 80px; font-family: inherit; }
        select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }
        select:disabled { background-color: #E5E7EB; cursor: not-allowed; color: #9CA3AF; }

        button {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 1rem;
        }

        button:hover { background-color: var(--primary-hover); }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #9CA3AF; cursor: not-allowed; }

        #test-area, #result-box { display: none; margin-top: 2rem; padding-top: 2rem; border-top: 2px solid #E5E7EB; }

        .question {
            background: #F9FAFB;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .question p { margin-top: 0; font-weight: 600; margin-bottom: 1rem; line-height: 1.4; }

        .options label {
            display: flex;
            align-items: center;
            font-weight: 400;
            margin-bottom: 0.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .options label:hover { background: #EEF2FF; }
        .options input[type="radio"] { margin-right: 10px; width: 18px; height: 18px; accent-color: var(--primary); }

        .feedback { margin-top: 1rem; padding: 1rem; border-radius: 8px; font-size: 0.95rem; display: none; line-height: 1.4;}
        .feedback.correct { background-color: #D1FAE5; color: #065F46; border: 1px solid #10B981; display: block; }
        .feedback.incorrect { background-color: #FEE2E2; color: #991B1B; border: 1px solid #EF4444; display: block; }
        .feedback.neutral { background-color: #DBEAFE; color: #1E40AF; border: 1px solid #3B82F6; display: block; }
        
        .score-display { font-size: 1.5rem; font-weight: bold; text-align: center; color: var(--primary); margin-bottom: 1rem; }
        
        .pool-info { text-align: center; font-size: 0.85rem; color: #6B7280; margin-top: 0.5rem; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Platforma Sprawdzianów</h1>
    
    <div class="form-group">
        <label for="subject">Wybierz przedmiot:</label>
        <select id="subject">
            <option value="" disabled selected>-- Wybierz --</option>
            <option value="Język Polski">Język Polski</option>
        </select>
    </div>

    <div class="form-group">
        <label for="topic">Wybierz temat sprawdzianu:</label>
        <select id="topic" disabled>
            <option value="" disabled selected>-- Najpierw wybierz przedmiot --</option>
        </select>
    </div>

    <button id="generate-btn">Losuj Nowy Sprawdzian</button>
    <div class="pool-info" id="pool-info"></div>

    <div id="test-area">
        <h2 id="test-title">Sprawdzian</h2>
        <div id="questions-container"></div>
        <button id="check-btn">Oddaj sprawdzian do oceny</button>
    </div>

    <div id="result-box">
        <div class="score-display" id="score-text"></div>
        <div id="teacher-comment"></div>
    </div>
</div>

            ],
            open: [
                { q: "Wymień trzy kryzysy, które według tabeli odzwierciedlają Treny (IX, X, XI) Jana Kochanowskiego.", key: "1) Kryzys światopoglądowy (mądrość), 2) Kryzys religijny, 3) Kryzys światopoglądowy (cnota)." },
                { q: "Jakie zagadnienia przypisano w tabeli do 'Lamentu świętokrzyskiego'?", key: "Desakralizacja Matki Boskiej, apostrofy, relacja Matki Boskiej i Jezusa." },
                { q: "Wymień co najmniej trzy mity z 'Mitologii' Parandowskiego obowiązujące do matury według nowej tabeli.", key: "Do wyboru: o Syzyfie, o Prometeuszu, o Orfeuszu i Eurydyce, o Narcyzie, o rodzie Labdakidów, o wojnie trojańskiej." },
                { q: "Jakie zagadnienia łączą się w tabeli z Księgą Hioba?", key: "Historia Hioba, cierpienie niezawinione." },
                { q: "Jakie zagadnienia przypisano do 'Hymnu do miłości ojczyzny' I. Krasickiego?", key: "Poezja tyrtejska, okoliczności powstania utworu, środki stylistyczne i interpretacja." },
                { q: "Jakie pojęcia z teorii dramatu antycznego przypisano do 'Antygony'? (Wymień minimum trzy).", key: "Dramat antyczny, konflikt tragiczny, tragizm, ironia tragiczna, hybris." },
                { q: "Jakie dokładnie zdarzenie (epizod) z 'Iliady' jest wpisane do tabeli jako zagadnienie?", key: "Pojedynek Hektora i Achillesa." },
                { q: "Jakie cechy formy i budowy przypisano w tabeli do 'Bogurodzicy'?", key: "Archaizmy, cechy pieśni i modlitwy, budowa utworu." },
                { q: "Podaj trzy cechy przypisane w tabeli do 'Rozmowy Mistrza Polikarpa ze Śmiercią'.", key: "Alegoryczny obraz śmierci, groteskowość, danse macabre." },
                { q: "Jakie dwa główne zagadnienia obowiązują Cię z 'Pieśni o Rolandzie'?", key: "Etos rycerza, ars bene moriendi." },
                { q: "Wymień dwóch autorów i tytuły ich wierszy przypisanych do epoki baroku w nowej tabeli.", key: "Daniel Naborowski 'Krótkość żywota', Jan Andrzej Morsztyn 'Do trupa'." },
                { q: "Wymień trzy główne pojęcia tematyczne przypisane w tabeli do 'Makbeta'.", key: "Motyw władzy, femme fatale, brak fatum." },
                { q: "Jakiego terminu używa tabela do określenia gatunku literackiego 'Skąpca'?", key: "Komedia molierowska." },
                { q: "Oprócz 'poezji tyrtejskiej', jakie dwa inne zagadnienia zapisano przy Hymnie do miłości ojczyzny?", key: "Okoliczności powstania utworu oraz środki stylistyczne i interpretacja." },
                { q: "Wymień wszystkie pięć ksiąg lub fragmentów biblijnych wypisanych z nazwy w lekturach obowiązkowych w tabeli.", key: "Księga Rodzaju, Księga Hioba, Księga Koheleta, Księga Psalmów, Apokalipsa św. Jana." }
            ]
        }
    };

    let currentClosed = [];
    let currentOpen = [];
    let activeTopic = "";

    const topicsList = { 
        "Język Polski": [
            "Zagadnienia maturalne z notatek (Stara baza)",
            "Sprawdzian z antyku poprawa"
        ] 
    };

    const subjectSelect = document.getElementById("subject");
    const topicSelect = document.getElementById("topic");
    const generateBtn = document.getElementById("generate-btn");
    const poolInfo = document.getElementById("pool-info");
    const testArea = document.getElementById("test-area");
    const testTitle = document.getElementById("test-title");
    const questionsContainer = document.getElementById("questions-container");
    const resultBox = document.getElementById("result-box");
    const checkBtn = document.getElementById("check-btn");

    subjectSelect.addEventListener("change", function() {
        const selectedSubject = this.value;
        topicSelect.innerHTML = '<option value="" disabled selected>-- Wybierz temat sprawdzianu --</option>';
        topicSelect.disabled = false;
        topicsList[selectedSubject].forEach(topic => {
            topicSelect.innerHTML += `<option value="${topic}">${topic}</option>`;
        });
        testArea.style.display = "none";
        resultBox.style.display = "none";
        poolInfo.style.display = "none";
    });

    topicSelect.addEventListener("change", function() {
        activeTopic = this.value;
        const currentData = quizzesData[activeTopic];
        poolInfo.style.display = "block";
        poolInfo.textContent = `Wybrano bazę: ${activeTopic}. Pula wynosi: ${currentData.closed.length} pytań zamkniętych, ${currentData.open.length} pytań otwartych.`;
    });

    // Pętla losująca (mieszająca tablicę)
    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    generateBtn.addEventListener("click", function() {
        if (!topicSelect.value) { alert("Wybierz temat sprawdzianu z listy!"); return; }

        const currentData = quizzesData[activeTopic];

        checkBtn.textContent = "Oddaj sprawdzian do oceny";
        checkBtn.disabled = false;
        checkBtn.style.backgroundColor = "var(--primary)";
        resultBox.style.display = "none";
        questionsContainer.innerHTML = "";
        testArea.style.display = "block";
        testTitle.textContent = `Test: ${activeTopic}`;

        // Wyciąganie LOSOWYCH pytań z maksymalnej puli danej kategorii
        currentClosed = shuffleArray(currentData.closed).slice(0, 3);
        currentOpen = shuffleArray(currentData.open).slice(0, 2);

        let questionNumber = 1;

        currentClosed.forEach((qObj, index) => {
            const optionsHtml = Object.entries(qObj.options).map(([key, value]) => `
                <label><input type="radio" name="c_${index}" value="${key}"> ${key}) ${value}</label>
            `).join('');

            questionsContainer.innerHTML += `
                <div class="question">
                    <p>${questionNumber}. ${qObj.q}</p>
                    <div class="options">${optionsHtml}</div>
                    <div id="c-feedback-${index}" class="feedback"></div>
                </div>
            `;
            questionNumber++;
        });

        currentOpen.forEach((qObj, index) => {
            questionsContainer.innerHTML += `
                <div class="question">
                    <p>${questionNumber}. ${qObj.q}</p>
                    <textarea placeholder="Wpisz swoją odpowiedź..."></textarea>
                    <div id="o-feedback-${index}" class="feedback"></div>
                </div>
            `;
            questionNumber++;
        });
    });

    checkBtn.addEventListener("click", function() {
        let score = 0;

        currentClosed.forEach((qObj, index) => {
            const selected = document.querySelector(`input[name="c_${index}"]:checked`);
            const feedbackBox = document.getElementById(`c-feedback-${index}`);
            
            if (selected) {
                if (selected.value === qObj.correct) {
                    score++;
                    feedbackBox.textContent = qObj.feedback;
                    feedbackBox.className = "feedback correct";
                } else {
                    feedbackBox.textContent = `Błąd. Poprawna odpowiedź to ${qObj.correct}.`;
                    feedbackBox.className = "feedback incorrect";
                }
            } else {
                feedbackBox.textContent = `Brak odpowiedzi. Poprawna to ${qObj.correct}.`;
                feedbackBox.className = "feedback incorrect";
            }
        });

        currentOpen.forEach((qObj, index) => {
            const feedbackBox = document.getElementById(`o-feedback-${index}`);
            feedbackBox.innerHTML = `<strong>Klucz oceniania (AI):</strong><br>${qObj.key}`;
            feedbackBox.className = "feedback neutral";
        });

        const scoreDisplay = document.getElementById("score-text");
        const comment = document.getElementById("teacher-comment");
        
        let finalGrade = 1;
        if (score === 3) finalGrade = "4 lub 5";
        else if (score === 2) finalGrade = "3";
        else if (score === 1) finalGrade = "2";

        resultBox.style.display = "block";
        scoreDisplay.textContent = `Punkty (zamknięte): ${score}/3`;
        comment.innerHTML = `
            <p><strong>Szacunkowa ocena z części zamkniętej: ${finalGrade}</strong></p>
            <p>Pytania otwarte zweryfikuj samodzielnie na podstawie klucza (zielone pole pod Twoją odpowiedzią). Jeśli chcesz podejść do kolejnej próby losowania, kliknij <em>"Losuj Nowy Sprawdzian"</em> na górze strony!</p>
        `;
        
        checkBtn.textContent = "Test sprawdzony";
        checkBtn.disabled = true;
    });
</script>

</body>
</html>
