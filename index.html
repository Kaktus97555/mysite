<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I KURWA ARCHIWUM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #141414; color: #fff; padding-top: 70px; }
        .navbar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 4%; z-index: 1000; background-color: #1db954; }
        .logo { color: #fff; font-size: 24px; font-weight: bold; text-decoration: none; cursor: pointer; }
        .toggle-btn { background: #141414; color: white; border: 1px solid white; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
        .hero { padding: 50px 4%; text-align: center; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px 4%; }
        .movie-card { cursor: pointer; transition: 0.3s; }
        .movie-card:hover { transform: scale(1.05); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 6px; }
        .card-title { font-size: 14px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { width: 90%; max-width: 800px; position: relative; }
        .close-modal { position: absolute; top: -40px; right: 0; cursor: pointer; font-size: 30px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo" onclick="resetToRoot()">I KURWA ARCHIWUM</a>
        <button id="sourceToggleBtn" class="toggle-btn" onclick="toggleSource()">Źródło: Dysk</button>
    </nav>

    <div class="hero">
        <h1 id="viewTitle">Biblioteka Główna</h1>
    </div>

    <div class="movie-grid" id="gallery"></div>

    <div class="modal" id="playerModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <iframe id="videoPlayer" width="100%" height="450" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // --- KONFIGURACJA ---
        const SHEET_ID = '1PE-EXZSdns2j0YbXP6BVdyRwTgs2J4gMWqiw_LjjRrg'; // Podmień na swój ID
        let currentMode = 'drive';
        let sheetDatabase = [];
        let folderHistory = [];
        let currentFolder = null;

        // --- PRZEŁĄCZANIE ŹRÓDŁA ---
        function toggleSource() {
            currentMode = (currentMode === 'drive') ? 'sheet' : 'drive';
            document.getElementById('sourceToggleBtn').innerText = (currentMode === 'drive') ? 'Źródło: Dysk' : 'Źródło: Arkusz';
            resetToRoot();
        }

        function resetToRoot() {
            folderHistory = [];
            currentFolder = null;
            loadContent(null, 'Biblioteka Główna');
        }

        // --- GŁÓWNA FUNKCJA ŁADOWANIA ---
        async function loadContent(path, title) {
            currentFolder = path;
            document.getElementById('viewTitle').innerText = title;
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = 'Ładowanie...';

            if (currentMode === 'drive') {
                loadFromDrive(path);
            } else {
                loadFromSheet(path);
            }
        }

        // --- LOGIKA DYSKU ---
        async function loadFromDrive(folderId) {
            try {
                let url = '/.netlify/functions/getFiles';
                if (folderId) url += `?folderId=${folderId}`;
                const res = await fetch(url);
                const files = await res.json();
                renderGallery(files, 'drive');
            } catch (e) {
                document.getElementById('gallery').innerText = "Błąd połączenia z Dyskiem.";
            }
        }

        // --- LOGIKA ARKUSZA ---
        async function loadFromSheet(path) {
            if (sheetDatabase.length === 0) {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
                const res = await fetch(url);
                let text = await res.text();
                text = text.substring(text.indexOf("({") + 1, text.lastIndexOf("})") + 1);
                const json = JSON.parse(text);
                
                json.table.rows.forEach(row => {
                    const getVal = (i) => (row.c[i] && row.c[i].v) ? row.c[i].v.toString().trim() : '';
                    if (getVal(0).toLowerCase() !== 'uniwersum') {
                        sheetDatabase.push({
                            uni: getVal(0), ser: getVal(1), sez: getVal(2), odc: getVal(3), 
                            link: getVal(4), img: getVal(5)
                        });
                    }
                });
            }
            // Logika wyświetlania (uproszczona dla stabilności)
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            // To jest wersja uproszczona - w zależności od ścieżki filtrujemy bazę
            sheetDatabase.forEach(item => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `<img src="${item.img || 'https://via.placeholder.com/160x240'}"><div class="card-title">${item.odc || item.ser}</div>`;
                card.onclick = () => playVideo(item.link);
                gallery.appendChild(card);
            });
        }

        function renderGallery(items, type) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `<div class="card-title">${item.name}</div>`;
                card.onclick = () => {
                     if(item.mimeType.includes('folder')) {
                         folderHistory.push(currentFolder);
                         loadContent(item.id, item.name);
                     } else {
                         playVideo(item.webViewLink?.replace('/view','/preview'));
                     }
                };
                gallery.appendChild(card);
            });
        }

        function playVideo(url) {
            document.getElementById('videoPlayer').src = url;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('videoPlayer').src = '';
            document.getElementById('playerModal').style.display = 'none';
        }

        // Start
        resetToRoot();
    </script>
</body>
</html>
